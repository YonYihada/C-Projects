<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Log In</h1>
        <p class="message" id="message">
            
        </p>
        <form onsubmit="checkLogin(event)">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" minlength="8" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="stayIn"> Stay signed in
                </label>
            </div>

            <button type="submit" class="login-btn">
                ➤
            </button>
        </form>

        <p class="hyperlink">
            <a href="forgotPassword.html">Can't sign in?</a>
            <br>
            <a href="signupPage.html">Create an Account</a>
        </p>
    </div>
</body>
</html>
